spring.application.name=finance-tracker-api
spring.config.import=optional:file:./src/main/resources/application-secrets.properties,optional:file:./backend/src/main/resources/application-secrets.properties
server.forward-headers-strategy=none

management.endpoints.web.exposure.include=health

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:3600000}
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
app.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.rate-limit.max-entries=${AUTH_RATE_LIMIT_MAX_ENTRIES:10000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-3.1-flash-lite}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:3}
app.ai.wallet-requests-per-minute=${AI_WALLET_REQUESTS_PER_MINUTE:10}
